      #bg { background-position: 38% center; }
    }
    @media (max-width: 600px) {
      #bg { background-position: 30% center; }
    }
    @media (max-width: 400px) {
      #bg { background-position: 25% center; }
    }

    /* Spacer — body tall enough to "scroll" for navigation */
    #spacer {
      display: block;
      position: relative;
      z-index: 1;
      pointer-events: none;
      /* height set by JS to exact window.innerHeight */
      height: 100vh;
    }

    /* ══════════════════════════════════════════════
       NAVBAR
    ══════════════════════════════════════════════ */
    .nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--nav-h);
      z-index: 100;
      background: transparent;
      border-bottom: 1px solid transparent;
      transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
    }
    .nav.is-scrolled {
      background: rgba(240,252,255,0.97);
      border-bottom-color: var(--border-s);
      box-shadow: 0 6px 28px rgba(0,0,0,0.10);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .nav-inner {
      height: 100%; display: flex; align-items: center;
      justify-content: space-between; padding: 0 2rem;
    }
    .nav-brand {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none; flex-shrink: 0; transition: opacity 0.2s;
    }
    .nav-brand:hover { opacity: 0.85; }
    .nav-logo { width: 46px; height: 46px; object-fit: contain; display: block; }
    .nav-brand-words { display: flex; flex-direction: column; line-height: 1.15; }
    .nav-brand-name {
      font-family: var(--font-ui); font-size: 1.25rem; font-weight: 800;
      color: #fff; white-space: nowrap;
      text-shadow: 0 1px 8px rgba(0,0,0,0.5);
      transition: color 0.3s, text-shadow 0.3s;
    }
    .nav-brand-tag {
      font-family: var(--font-ui); font-size: 0.52rem; font-weight: 600;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: rgba(255,255,255,0.85); margin-top: 2px; white-space: nowrap;
      transition: color 0.3s;
    }
    .nav.is-scrolled .nav-brand-name { color: #1c0f63; text-shadow: none; }
    .nav.is-scrolled .nav-brand-tag  { color: var(--teal); }

    .nav-links { display: flex; align-items: center; gap: 0.15rem; list-style: none; }
    .nav-link {
      font-family: var(--font-ui); font-size: 0.85rem; font-weight: 600;
      text-decoration: none; color: #fff; padding: 0.42rem 0.85rem;
      border-radius: 50px; border: 1.5px solid transparent; white-space: nowrap;
      text-shadow: 0 1px 8px rgba(0,0,0,0.5);
      transition: color 0.2s, background 0.2s, border-color 0.2s, text-shadow 0.3s;
    }
    .nav-link:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.30); }
    .nav.is-scrolled .nav-link { color: #1a5040; text-shadow: none; }
    .nav.is-scrolled .nav-link:hover {
      background: rgba(90,200,232,0.10); border-color: rgba(90,200,232,0.25); color: #0d2a1a;
    }

    .nav-burger {
      display: none; flex-direction: column; justify-content: center;
      gap: 5px; padding: 6px; border: none; background: none;
      cursor: pointer; border-radius: 8px; transition: background 0.2s;
    }
    .nav-burger:hover { background: rgba(255,255,255,0.15); }
    .burger-line {
      width: 22px; height: 2px; background: #fff; border-radius: 2px; display: block;
      transition: transform 0.25s, opacity 0.25s, background 0.3s;
    }
    .nav.is-scrolled .burger-line { background: #0d2a1a; }
    .nav-burger.is-open .burger-line:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .nav-burger.is-open .burger-line:nth-child(2) { opacity: 0; transform: scaleX(0); }
    .nav-burger.is-open .burger-line:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    .nav-drawer {
      position: fixed; top: var(--nav-h); left: 0; right: 0;
      background: #fff; border-top: 1px solid var(--border);
      border-bottom: 2px solid var(--border-s);
      box-shadow: 0 12px 40px rgba(0,0,0,0.18);
      max-height: 0; overflow: hidden;
      transition: max-height 0.35s var(--ease); z-index: 99;
    }
    .nav-drawer.is-open { max-height: 400px; }
    .drawer-links { list-style: none; padding: 0.8rem 1.4rem 1rem; }
    .drawer-link {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.9rem 0.8rem; text-decoration: none; color: #1a5040;
      font-family: var(--font-ui); font-size: 1rem; font-weight: 600;
      border-bottom: 1px solid var(--border); border-radius: 8px;
      transition: color 0.18s, background 0.18s, padding-left 0.18s;
    }
    .drawer-link:last-child { border-bottom: none; }
    .drawer-link:hover { color: #0d2a1a; background: rgba(90,200,232,0.07); padding-left: 1.2rem; }
    .drawer-arrow { font-size: 1rem; opacity: 0.4; }

    /* ══════════════════════════════════════════════
       HERO CONTENT LAYER
    ══════════════════════════════════════════════ */
    .hero {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      pointer-events: none;
    }
    .hero-inner { pointer-events: auto; }

    /* Desktop: left-side card, no bg */
    .hero-inner {
      position: absolute;
      left: clamp(1.6rem, 3.5vw, 3.6rem);
      top: 50%;
      transform: translateY(-50%);
      max-width: 46%;
      color: var(--dark);
      display: flex; flex-direction: column; gap: 0.4rem;
      align-items: flex-start;
    }

    .hero-established {
      font-family: var(--font-ui); color: var(--green);
      letter-spacing: 0.28em; text-transform: uppercase;
      font-weight: 700; font-size: 0.82rem;
      display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.2rem;
    }
    .hero-established::after {
      content: ''; display: inline-block; width: 32px; height: 1.5px; background: var(--green);
    }
    .hero-tagline {
      font-family: var(--font-ui); font-size: 0.82rem; text-transform: uppercase;
      letter-spacing: 0.18em; font-weight: 700; color: #2f4046; margin-bottom: 0.4rem;
    }
    .hero-heading {
      font-family: var(--font-display); font-weight: 700;
      font-size: clamp(3rem, 9vw, 6.4rem); line-height: 0.95;
      text-transform: uppercase; color: var(--navy);
      margin: 0.2rem 0 0.35rem; letter-spacing: -0.01em;
    }
    .hero-divider { display: flex; align-items: center; gap: 0.6rem; margin: 0.1rem 0 0.5rem; }
    .hero-divider-line { width: 36px; height: 1px; background: #8cb88c; }
    .hero-divider-leaf { font-size: 1rem; line-height: 1; }
    .hero-sub {
      font-family: var(--font-body); color: #2f3a2e;
      font-size: 1.2rem; font-weight: 700; line-height: 1.7;
      max-width: 240px; margin-bottom: 1.6rem; letter-spacing: 0.02em;
    }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    .hero-cta { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .hero-cta-text {
      font-family: var(--font-ui); font-size: 0.78rem; color: #3a4a3a;
      letter-spacing: 0.18em; font-weight: 700;
      animation: blink 0.7s step-end infinite;
    }
    .hero-cta-button {
      width: 80px; height: 34px; border-radius: 999px;
      border: 2px solid var(--navy); background: transparent;
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--navy); cursor: pointer; font-size: 1rem;
    }

    /* ══════════════════════════════════════════════
       RESPONSIVE
    ══════════════════════════════════════════════ */
    @media (max-width: 1100px) {
      .nav-links { display: none; }
      .nav-burger { display: flex; }
    }

    @media (max-width: 900px) {
      .hero-inner { left: 2rem; max-width: 70%; }
      .hero-heading { font-size: clamp(2rem, 9vw, 4rem); }
    }

    /* Mobile — card pinned to bottom */
    @media (max-width: 700px) {
      .hero {
        align-items: flex-end;
        padding-bottom: 2rem;
        padding-bottom: max(2rem, env(safe-area-inset-bottom));
      }
      .hero-inner {
        position: relative;
        left: auto; top: auto; transform: none;
        width: calc(100% - 2.4rem);
        max-width: 100%;
        margin: 0 1.2rem;
        padding: 1.6rem 1.4rem;
        background: rgba(232,224,208,0.88);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-radius: 14px;
        box-shadow: 0 8px 40px rgba(0,0,0,0.25);
      }
      .hero-heading { font-size: clamp(2.4rem, 11vw, 3.4rem); }
      .hero-sub { max-width: 100%; margin-bottom: 1.2rem; }
    }

    @media (max-width: 380px) {
      .hero-heading { font-size: clamp(2rem, 12vw, 2.8rem); }
      .hero-inner { padding: 1.2rem 1rem; }
    }
  </style>
</head>
<body>
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MRRNVJR5" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

<!-- ① Background — fixed, always covers viewport exactly -->
<div id="bg" aria-hidden="true"></div>

<!-- ② Navbar -->
<nav class="nav" id="nav">
  <div class="nav-inner">
    <a href="home.html" class="nav-brand" aria-label="Indo Thai Global — Home">
      <img src="assets/logo.png" alt="Indo Thai Global" class="nav-logo" draggable="false"/>
      <div class="nav-brand-words">
        <span class="nav-brand-name">Indo Thai Global</span>
        <span class="nav-brand-tag">Est. 2005 &middot; India</span>
      </div>
    </a>
    <ul class="nav-links" role="list">
      <li><a href="home.html"    class="nav-link">Home</a></li>
      <li><a href="about.html"   class="nav-link">About</a></li>
      <li><a href="contact.html" class="nav-link">Contact</a></li>
    </ul>
    <button class="nav-burger" id="burger" aria-label="Toggle navigation" aria-expanded="false">
      <span class="burger-line"></span>
      <span class="burger-line"></span>
      <span class="burger-line"></span>
    </button>
  </div>
</nav>

<!-- Drawer -->
<div class="nav-drawer" id="drawer" role="navigation" aria-label="Mobile navigation">
  <ul class="drawer-links" role="list">
    <li><a href="home.html"    class="drawer-link">Home    <span class="drawer-arrow">›</span></a></li>
    <li><a href="about.html"   class="drawer-link">About   <span class="drawer-arrow">›</span></a></li>
    <li><a href="contact.html" class="drawer-link">Contact <span class="drawer-arrow">›</span></a></li>
  </ul>
</div>

<!-- ③ Hero content -->
<section class="hero" aria-label="Landing">
  <div class="hero-inner">
    <span class="hero-established">EST. 2005</span>
    <span class="hero-tagline">SUSTAINABLE DRYING TECHNOLOGY</span>
    <h1 class="hero-heading">INDO THAI<br>GLOBAL</h1>
    <div class="hero-divider">
      <span class="hero-divider-line"></span>
      <span class="hero-divider-leaf">🌿</span>
    </div>
    <p class="hero-sub">Harnessing the power of the sun to preserve nature's finest harvests</p>
    <div class="hero-cta">
      <span class="hero-cta-text">CLICK ANYWHERE TO ENTER</span>
      <button class="hero-cta-button" aria-label="Enter site">↓</button>
    </div>
  </div>
</section>

<!-- ④ Spacer -->
<div id="spacer"></div>

<script>
  /* Exact viewport height → fixes iOS Safari 100vh and sizes spacer */
  (function () {
    function setSize() {
      var h = window.innerHeight;
      document.documentElement.style.setProperty('--vh', (h * 0.01) + 'px');
      var s = document.getElementById('spacer');
      if (s) s.style.height = h + 'px';
    }
    setSize();
    window.addEventListener('resize', setSize, { passive: true });
    window.addEventListener('orientationchange', function(){ setTimeout(setSize, 150); });
  })();

  /* Navbar scroll state */
  (function () {
    var nav = document.getElementById('nav');
    function tick() { nav.classList.toggle('is-scrolled', window.scrollY > 60); }
    window.addEventListener('scroll', tick, { passive: true });
    tick();
  })();

  /* Burger toggle */
  (function () {
    var burger = document.getElementById('burger');
    var drawer = document.getElementById('drawer');
    burger.addEventListener('click', function (e) {
      e.stopPropagation();
      var open = drawer.classList.toggle('is-open');
      burger.classList.toggle('is-open', open);
      burger.setAttribute('aria-expanded', String(open));
    });
    document.addEventListener('click', function (e) {
      if (!drawer.contains(e.target) && e.target !== burger) {
        drawer.classList.remove('is-open');
        burger.classList.remove('is-open');
        burger.setAttribute('aria-expanded', 'false');
      }
    });
  })();

  /* Click anywhere → zoom bg → go to home.html */
  (function () {
    document.addEventListener('click', function () {
      var bg = document.getElementById('bg');
      if (bg) {
        bg.style.transition = 'transform 0.18s ease, filter 0.18s ease';
        bg.style.transform  = 'scale(1.06)';
        bg.style.filter     = 'blur(8px)';
      }
      setTimeout(function () { window.location.href = 'home.html'; }, 130);
    }, { once: true });
  })();
</script>
</body>
</html>
